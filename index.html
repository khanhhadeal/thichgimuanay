<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ĐỔI LINK SHOPEE</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;

  background: linear-gradient(135deg, #ff9a9e, #fad0c4);

  display: flex;
  justify-content: center;
  align-items: center;

  min-height: 100vh;
  padding: 20px;
  box-sizing: border-box;
}

.container {
  background: white;
  padding: 25px;
  border-radius: 20px;

  width: 100%;
  max-width: 360px;

  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  text-align: center;

  animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from {opacity: 0; transform: translateY(20px);}
  to {opacity: 1; transform: translateY(0);}
}

h2 {
  color: #ff4d6d;
  margin-bottom: 15px;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #ddd;
  margin-bottom: 15px;
  outline: none;
  transition: 0.2s;
}

input:focus {
  border-color: #ff4d6d;
  box-shadow: 0 0 5px rgba(255,77,109,0.3);
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 12px;

  background: linear-gradient(45deg, #ff4d6d, #ff758f);
  color: white;
  font-weight: bold;
  font-size: 15px;

  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: translateY(-2px);
  opacity: 0.95;
}

.copy {
  margin-top: 10px;
  background: linear-gradient(45deg, #ff758f, #ff9a9e);
}

#result {
  margin-top: 15px;
  font-size: 13px;
  word-break: break-all;
  color: #333;
}

/* Toast thông báo */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  color: white;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 14px;
  opacity: 0;
  transition: 0.3s;
}

.toast.show {
  opacity: 1;
}
</style>

</head>

<body>

<div class="container">
  <h2>💖 ĐỔI LINK SHOPEE ÁP MÃ 22%</h2>

  <input id="link" placeholder="Dán link Shopee vào đây...">

  <button onclick="convert()">🔗 Chuyển đổi link</button>

  <div id="result"></div>

  <button class="copy" onclick="copyLink()">📋 Copy link</button>
</div>

<div id="toast" class="toast">Đã copy!</div>

<script>
let finalLink = "";

function convert(){
  let url = document.getElementById("link").value;

  if(!url){
    showToast("❌ Nhập link trước!");
    return;
  }

  finalLink = "https://shopee.vn/?af_siteid=17356830150&url=" + encodeURIComponent(url);

  document.getElementById("result").innerHTML = "✅ " + finalLink;
}

function copyLink(){
  if(!finalLink){
    showToast("❌ Chưa có link!");
    return;
  }

  navigator.clipboard.writeText(finalLink);
  showToast("✅ Đã copy!");
}

function showToast(msg){
  let toast = document.getElementById("toast");
  toast.innerText = msg;
  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
  }, 2000);
}
</script>

</body>
</html>
